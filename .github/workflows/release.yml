name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2.0.1)'
        required: true
        default: '2.0.1'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install MinGW
      run: |
        choco install mingw -y --no-progress
      shell: pwsh
      
    - name: Add MinGW to PATH
      run: |
        echo "C:\ProgramData\mingw64\mingw64\bin" >> $env:GITHUB_PATH
      shell: pwsh
      
    - name: Verify MinGW installation
      run: |
        gcc --version
        mingw32-make --version
      shell: cmd
      
    - name: Build xNote
      run: |
        mingw32-make clean
        mingw32-make
      shell: cmd
      
    - name: Verify build
      run: |
        if (Test-Path "xnote.exe") {
          Write-Host "Build successful: xnote.exe exists"
          Get-Item "xnote.exe" | Select-Object Name, Length, LastWriteTime
        } else {
          Write-Error "Build failed: xnote.exe not found"
          exit 1
        }
      shell: pwsh
      
    - name: Install NSIS
      run: |
        choco install nsis -y --no-progress
      shell: pwsh
      
    - name: Add NSIS to PATH
      run: |
        echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      shell: pwsh
      
    - name: Verify NSIS installation
      run: |
        makensis /VERSION
      shell: cmd
      
    - name: Get version from tag or input
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
        } else {
          $version = "${{ github.ref_name }}".TrimStart('v')
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"
      shell: pwsh
      
    - name: Update version in NSI file
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $nsiFile = "installer/xnote.nsi"
        $content = Get-Content $nsiFile -Raw
        $content = $content -replace '!define PRODUCT_VERSION ".*"', "!define PRODUCT_VERSION `"$version`""
        Set-Content $nsiFile $content
        Write-Host "Updated version to $version in $nsiFile"
      shell: pwsh
      
    - name: Build Installer
      run: |
        cd installer
        makensis xnote.nsi
      shell: cmd
      
    - name: List installer output
      run: |
        Get-ChildItem installer/*.exe
      shell: pwsh
      
    - name: Create Release artifacts directory
      run: |
        New-Item -ItemType Directory -Force -Path release-artifacts
        Copy-Item xnote.exe release-artifacts/
        Copy-Item installer/xnote-setup-*.exe release-artifacts/
      shell: pwsh
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xnote-release-${{ steps.version.outputs.VERSION }}
        path: release-artifacts/
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        fi
      
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: xnote-release-${{ steps.version.outputs.VERSION }}
        path: release-artifacts/
        
    - name: List downloaded files
      run: ls -la release-artifacts/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: xNote v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          release-artifacts/xnote.exe
          release-artifacts/xnote-setup-*.exe
        body: |
          ## xNote v${{ steps.version.outputs.VERSION }}
          
          ### Downloads
          - **xnote.exe** - Portable executable (no installation required)
          - **xnote-setup-${{ steps.version.outputs.VERSION }}.exe** - Windows installer
          
          ### Installation
          #### Portable Version
          1. Download `xnote.exe`
          2. Run directly - no installation needed
          
          #### Installer Version
          1. Download the installer
          2. Run and follow the wizard
          
          ### Features
          - Multi-tab text editor
          - Syntax highlighting
          - Vim mode support
          - Multi-cursor editing (Ctrl+D, Alt+Click)
          - Large file support
          - JSON formatting
          - Session restore
          - Dark/Light themes
